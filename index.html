<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Stack IA, la méthode STRATEGEO : formation écrite en onze modules sur l'intelligence artificielle appliquée à l'administration.">
<meta name="theme-color" content="#16181D">
<title>Stack IA, la méthode STRATEGEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* Layout : une colonne de lecture étroite façon note administrative, un sommaire latéral sur grand écran. Monochrome, encre sur papier. */
:root {
  --bg: #FFFFFF;
  --surface: #F3F4F6;
  --ink: #16181D;
  --muted: #5B616D;
  --line: #DCDFE4;
  --strong: #16181D;
  --on-strong: #FFFFFF;
  --focus: #16181D;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --t-xs: 0.75rem; --t-sm: 0.875rem; --t-base: 1rem; --t-read: 1.125rem;
  --t-lg: 1.375rem; --t-xl: 1.875rem; --t-2xl: clamp(2rem, 5vw, 3.25rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1A1D22; --ink: #E7E9EC; --muted: #9CA2AC; --line: #2D3138;
    --strong: #E7E9EC; --on-strong: #111317; --focus: #E7E9EC; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1A1D22; --ink: #E7E9EC; --muted: #9CA2AC; --line: #2D3138;
  --strong: #E7E9EC; --on-strong: #111317; --focus: #E7E9EC; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: var(--t-base); line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; }
.proto { border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); text-align: center; padding-block: 6px; letter-spacing: 0.02em; }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand b { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
.brand span { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 8px 10px; cursor: pointer; font-size: var(--t-sm); color: var(--muted); border-radius: 4px; }
.nav button:hover, .nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"] { text-decoration: underline; text-underline-offset: 6px; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 4px; border: 1px solid var(--strong); background: var(--strong); color: var(--on-strong); font-weight: 600; font-size: var(--t-sm); cursor: pointer; text-decoration: none; }
.btn:hover { opacity: 0.88; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); opacity: 1; }
.btn.small { padding: 7px 12px; }
.nav .btn { background: var(--strong); color: var(--on-strong); padding: 8px 14px; }
.nav .btn:hover { color: var(--on-strong); }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--muted); font-size: var(--t-sm); }
.linkbtn:hover { color: var(--ink); }

/* Typo */
.eyebrow { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { font-family: var(--serif); text-wrap: balance; letter-spacing: -0.01em; margin: 0; }
h1 { font-size: var(--t-2xl); line-height: 1.08; font-weight: 600; }
h2 { font-size: var(--t-xl); line-height: 1.2; font-weight: 600; }
h3 { font-size: var(--t-lg); line-height: 1.3; font-weight: 600; }
.lede { font-family: var(--serif); font-size: 1.25rem; line-height: 1.5; color: var(--muted); max-width: 40ch; margin: 0; }
p { margin: 0; }

/* Accueil */
.section { padding-block: 56px; border-bottom: 1px solid var(--line); }
.section:last-of-type { border-bottom: 0; }
.hero { padding-block: 64px 56px; display: grid; gap: 28px; }
.hero h1 { max-width: 16ch; }
.hero .actions { display: flex; gap: 12px; flex-wrap: wrap; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; font-family: var(--mono); font-size: var(--t-sm); color: var(--muted); padding-top: 8px; }
.facts b { color: var(--ink); font-weight: 500; }
.sec-head { display: grid; gap: 10px; margin-bottom: 32px; max-width: 62ch; }
.sec-head p { color: var(--muted); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px 40px; }
.cols > div { display: grid; gap: 8px; align-content: start; min-width: 0; }
.cols h3 { font-size: 1.125rem; }
.cols p { color: var(--muted); font-size: var(--t-sm); }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.levels > div { padding: 18px 16px; display: grid; gap: 6px; border-right: 1px solid var(--line); align-content: start; }
.levels > div:last-child { border-right: 0; }
.levels .n { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); }
.levels b { font-family: var(--serif); font-size: 1.125rem; }
.levels p { font-size: var(--t-sm); color: var(--muted); }
.levels .target { background: var(--surface); }
.levels .target .n::after { content: " · objectif du parcours"; }
@media (max-width: 760px) { .levels { grid-template-columns: 1fr 1fr; } .levels > div:nth-child(2) { border-right: 0; } .levels > div:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }
@media (max-width: 420px) { .levels { grid-template-columns: 1fr; } .levels > div { border-right: 0; border-bottom: 1px solid var(--line); } .levels > div:last-child { border-bottom: 0; } }

.program { display: grid; gap: 36px; }
.part { display: grid; grid-template-columns: 200px 1fr; gap: 24px; }
.part-head { display: grid; gap: 4px; align-content: start; }
.part-head .eyebrow { color: var(--ink); }
.part-head small { color: var(--muted); font-size: var(--t-sm); }
.mods { display: grid; border-top: 1px solid var(--line); }
.mod-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; align-items: baseline; padding-block: 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.mod-row .code { font-family: var(--mono); font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.mod-row .txt { display: grid; gap: 4px; min-width: 0; }
.mod-row .txt b { font-family: var(--serif); font-size: 1.125rem; font-weight: 600; }
.mod-row .txt span { color: var(--muted); font-size: var(--t-sm); }
.mod-row .meta { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); white-space: nowrap; }
@media (max-width: 760px) { .part { grid-template-columns: 1fr; gap: 12px; } .mod-row { grid-template-columns: 44px 1fr; } .mod-row .meta { grid-column: 2; } }

.quote { font-family: var(--serif); font-size: 1.375rem; line-height: 1.45; max-width: 46ch; border-left: 2px solid var(--ink); padding-left: 20px; }
.trainer { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.trainer .bio { display: grid; gap: 14px; color: var(--muted); }
.trainer .bio b { color: var(--ink); }
@media (max-width: 760px) { .trainer { grid-template-columns: 1fr; } }

.plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.plan { border: 1px solid var(--line); border-radius: 4px; padding: 24px; display: grid; gap: 14px; align-content: start; }
.plan.main { border-color: var(--ink); }
.plan .price { font-family: var(--serif); font-size: 1.875rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.plan .price small { font-family: var(--sans); font-size: var(--t-sm); color: var(--muted); font-weight: 400; }
.plan ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: var(--t-sm); color: var(--muted); }
.plan .btn { margin-top: 6px; }
@media (max-width: 860px) { .plans { grid-template-columns: 1fr; } }
.note { font-size: var(--t-sm); color: var(--muted); margin-top: 16px; }

.faq { display: grid; border-top: 1px solid var(--line); max-width: 760px; }
.faq details { border-bottom: 1px solid var(--line); padding-block: 16px; }
.faq summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--mono); color: var(--muted); }
.faq details[open] summary::after { content: "–"; }
.faq details p { margin-top: 10px; color: var(--muted); max-width: 65ch; }

/* Accès */
.access { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; padding-block: 48px; }
@media (max-width: 860px) { .access { grid-template-columns: 1fr; } }
.panel { border: 1px solid var(--line); border-radius: 4px; padding: 24px; display: grid; gap: 18px; align-content: start; }
.field { display: grid; gap: 6px; }
.field label { font-size: var(--t-sm); font-weight: 600; }
.field input, .field select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.field input:focus, .field select:focus, textarea:focus { border-color: var(--ink); outline: none; }
.choice { display: grid; gap: 8px; }
.choice label { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; cursor: pointer; font-size: var(--t-sm); }
.choice label:has(input:checked) { border-color: var(--ink); }
.choice .p { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.msg { font-size: var(--t-sm); padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.msg.err { border-color: var(--ink); }

/* Tableau de bord */
.dash { padding-block: 40px 56px; display: grid; gap: 36px; }
.dash-top { display: grid; grid-template-columns: 1fr minmax(240px, 320px); gap: 24px; align-items: end; }
@media (max-width: 760px) { .dash-top { grid-template-columns: 1fr; } }
.progress { display: grid; gap: 8px; }
.bar { height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--strong); }
.progress .lbl { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.resume { border: 1px solid var(--ink); border-radius: 4px; padding: 20px 22px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.resume .txt { display: grid; gap: 4px; min-width: 0; }
.resume b { font-family: var(--serif); font-size: 1.25rem; }
@media (max-width: 560px) { .resume { grid-template-columns: 1fr; } }
.mod-btn { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; padding-inline: 0; }
.mod-btn:hover .txt b { text-decoration: underline; text-underline-offset: 4px; }
.chip { display: inline-block; font-family: var(--mono); font-size: var(--t-xs); padding: 2px 8px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.done { background: var(--strong); color: var(--on-strong); border-color: var(--strong); }
.chip.doing { border-color: var(--ink); color: var(--ink); }
.chip.lock { border-style: dashed; }
.free { margin-left: 8px; }

/* Lecteur */
.reader { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 48px; padding-block: 32px 64px; }
@media (max-width: 900px) { .reader { grid-template-columns: 1fr; gap: 24px; } }
.toc { display: grid; gap: 16px; align-content: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
@media (max-width: 900px) { .toc { position: static; } }
.toc .back { justify-self: start; }
.toc details { display: grid; gap: 16px; }
.toc summary { cursor: pointer; font-family: var(--mono); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-block: 4px; list-style: none; }
.toc summary::-webkit-details-marker { display: none; }
.toc summary::after { content: " +"; }
.toc details[open] summary::after { content: " –"; }
.toc details[open] > ol { margin-top: 12px; }
.toc details[open] > .box { margin-top: 16px; }
.toc h2 { font-size: 1.125rem; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.toc li button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; cursor: pointer; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; font-size: var(--t-sm); color: var(--muted); align-items: baseline; }
.toc li button:hover { color: var(--ink); }
.toc li button[aria-current="step"] { color: var(--ink); font-weight: 600; }
.toc .k { font-family: var(--mono); font-size: var(--t-xs); }
.toc .ok { font-family: var(--mono); font-size: var(--t-xs); }
@media (max-width: 900px) { .toc ol { grid-template-columns: 1fr; } }

.doc { max-width: 68ch; display: grid; gap: 28px; min-width: 0; }
.ref { display: grid; gap: 2px; font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); border-top: 2px solid var(--ink); padding-top: 12px; }
.ref .row { display: grid; grid-template-columns: 70px 1fr; gap: 8px; }
.doc h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); }
.prose { font-family: var(--serif); font-size: var(--t-read); line-height: 1.7; display: grid; gap: 1.05em; }
.prose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 0.4em; }
.prose strong { font-weight: 700; }
.cmd { font-family: var(--mono); font-size: 0.875rem; line-height: 1.6; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; display: grid; gap: 8px; position: relative; }
.cmd-label { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.cmd .copy { position: absolute; top: 10px; right: 10px; font-family: var(--sans); font-size: var(--t-xs); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px; cursor: pointer; color: var(--muted); }
.cmd .copy:hover { color: var(--ink); border-color: var(--ink); }
.sample { font-family: var(--serif); font-size: 1rem; line-height: 1.65; background: var(--bg); border: 1px solid var(--line); border-left: 2px solid var(--muted); border-radius: 0 4px 4px 0; padding: 14px 16px; display: grid; gap: 8px; }
.sample .cmd-label { font-family: var(--mono); }
.casetag { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); letter-spacing: 0.02em; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
.tbl { width: 100%; border-collapse: collapse; font-family: var(--sans); font-size: var(--t-sm); line-height: 1.45; }
.tbl th, .tbl td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-weight: 600; background: var(--surface); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.box { border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; display: grid; gap: 10px; }
.box ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.box.strong { border-color: var(--ink); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
textarea { min-height: 180px; resize: vertical; font-family: var(--sans); line-height: 1.55; }
.saved { font-size: var(--t-xs); color: var(--muted); font-family: var(--mono); }

/* Quiz */
.quiz { display: grid; gap: 24px; }
.quiz fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; }
.quiz legend { font-family: var(--serif); font-size: 1.125rem; font-weight: 600; margin-bottom: 10px; padding: 0; }
.quiz legend .k { font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); display: block; font-weight: 400; margin-bottom: 4px; }
.opt { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; cursor: pointer; font-size: var(--t-base); }
.opt:has(input:checked) { border-color: var(--ink); }
.opt input { margin-top: 4px; }
.opt .v { font-family: var(--mono); font-size: var(--t-xs); white-space: nowrap; }
.opt.right { border-color: var(--ink); border-width: 2px; }
.opt.wrong { border-style: dashed; }
.expl { font-size: var(--t-sm); color: var(--muted); padding-left: 2px; }
.expl b { color: var(--ink); }
.score { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
.score b { font-family: var(--serif); font-size: 2rem; font-variant-numeric: tabular-nums; }

/* Verrou */
.locked { border: 1px dashed var(--ink); border-radius: 4px; padding: 28px; display: grid; gap: 14px; justify-items: start; }

/* Attestation */
.att-wrap { padding-block: 40px 64px; display: grid; gap: 24px; justify-items: center; }
.att { width: 100%; max-width: 720px; border: 1px solid var(--ink); padding: clamp(24px, 6vw, 56px); display: grid; gap: 22px; position: relative; background: var(--bg); }
.att::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--line); pointer-events: none; }
.att .head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: var(--mono); font-size: var(--t-xs); color: var(--muted); }
.att h2 { font-size: clamp(1.5rem, 4vw, 2.125rem); text-align: center; letter-spacing: 0.04em; text-transform: uppercase; }
.att .body { font-family: var(--serif); font-size: 1.125rem; line-height: 1.7; display: grid; gap: 14px; }
.att .name { font-size: 1.5rem; font-weight: 700; text-align: center; }
.att .sign { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; font-size: var(--t-sm); margin-top: 12px; }
.att .stamp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-12deg); font-family: var(--mono); font-size: clamp(1rem, 4vw, 1.75rem); letter-spacing: 0.2em; border: 2px solid var(--muted); color: var(--muted); padding: 8px 16px; opacity: 0.7; pointer-events: none; white-space: nowrap; }

.foot { border-top: 1px solid var(--line); }
.foot .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 24px; font-size: var(--t-sm); color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--strong); color: var(--on-strong); padding: 10px 16px; border-radius: 4px; font-size: var(--t-sm); z-index: 50; max-width: calc(100% - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
const PARTS = [
  { code: "I", title: "Changer de posture", level: "Du niveau 1 au niveau 2", modules: ["m1", "m2"] },
  { code: "II", title: "Produire", level: "Du niveau 2 au niveau 3", modules: ["m3", "m4", "m5", "m6"] },
  { code: "III", title: "Sécuriser", level: "Les conditions du niveau 3", modules: ["m7", "m8", "m9"] },
  { code: "IV", title: "Industrialiser", level: "Vers le niveau 4", modules: ["m10", "m11"] }
];

const MODULES = {
  m1: {
    num: 1,
    title: "Ce que l'IA change dans le travail administratif",
    summary: "Situer son niveau d'usage, choisir la collaboration plutôt que la délégation aveugle, connaître les limites de l'outil.",
    objectifs: [
      "Vous situer sur l'échelle des quatre niveaux d'usage",
      "Distinguer collaborer et déléguer à l'aveugle",
      "Connaître les trois faiblesses structurelles de l'IA"
    ],
    lessons: [

        b: `<p>Vous ne diriez jamais à un nouveau collaborateur : « Fais-moi une note sur l'apprentissage », puis rien d'autre. Vous lui expliqueriez pour qui, pourquoi, sous quelle forme, pour quand. Avec l'IA, beaucoup de gens oublient cette évidence.</p>
<p>Or l'IA a un handicap que n'a pas votre collaborateur : elle ne connaît ni votre institution, ni votre Ministre, ni l'histoire du dossier. Elle ne peut pas lire entre les lignes. Tout ce que vous ne dites pas, elle le comble avec des généralités.</p>
<p>Une bonne commande contient cinq éléments.</p>
<p><strong>1/ Le contexte.</strong> Qui vous êtes, dans quelle institution, sur quel dossier, à quel moment. « Je suis conseiller technique au cabinet du ministre chargé de l'enseignement technique. La rentrée a lieu dans trois semaines. Le Ministre reçoit le patronat jeudi. » Ces trois phrases changent tout ce qui suivra.</p>
<p><strong>2/ Le destinataire.</strong> Pour qui est le document ? Un Ministre veut la décision à prendre, en une page. Un directeur technique veut le détail opérationnel. Un partenaire étranger a besoin du contexte que vous jugez évident. Un journaliste cherchera la phrase qui fait le titre. Nommez votre lecteur, et l'IA ajustera le niveau de détail, le vocabulaire et l'angle.</p>
<p><strong>3/ Le livrable.</strong> La forme exacte. Pas « un document », mais « une note d'une page au format objet, contexte, enjeux, options, recommandation ». Pas « un discours », mais « un discours de sept minutes ». Pas « des idées », mais « un tableau de cinq lignes, trois colonnes ».</p>
<p><strong>4/ Les contraintes.</strong> Le ton, la longueur, et surtout ce qu'il ne faut pas dire. Les sujets sensibles du moment, les chiffres non encore publiés, le partenaire qu'il ne faut pas nommer. L'IA ne devinera jamais vos lignes rouges.</p>
<p><strong>5/ La matière.</strong> Les documents, chiffres et notes de réunion sur lesquels elle doit s'appuyer. C'est l'objet de la leçon suivante.</p>
<p>Comparez maintenant.</p>
<div class="sample"><span class="cmd-label">Commande faible</span><p>Fais-moi une note sur l'apprentissage.</p></div>
<div class="cmd"><span class="cmd-label">Commande complète</span><p>Je suis conseiller technique au cabinet du ministre chargé de l'enseignement technique. Le Ministre reçoit jeudi les représentants du patronat sur le développement de l'apprentissage. Rédige une note d'une page à son attention, au format : objet, contexte, enjeux, options, recommandation. Appuie-toi uniquement sur les trois documents joints. Ton institutionnel et sobre. Termine par trois propositions concrètes que le Ministre pourrait faire au patronat. N'évoque pas le dossier de la taxe d'apprentissage, en cours d'arbitrage.</p></div>
<p>La seconde prend une minute de plus à écrire. Elle vous fait gagner une heure de reprise.</p>
<p>Un mot sur une pratique répandue : commencer par « Tu es un expert en... ». Attribuer un rôle à l'IA n'est pas inutile, mais c'est beaucoup moins efficace que de lui donner le contexte réel. « Tu es un expert en politiques éducatives » lui dit peu. « Le Ministre reçoit le patronat jeudi » lui dit tout ce dont elle a besoin.</p>`

        b: `<p>L'erreur la plus fréquente consiste à demander à l'IA de produire à partir de rien. Elle le fera, sans protester. Elle remplira le vide avec des généralités plausibles, et parfois avec des inventions.</p>
<p>La parade, c'est le <strong>dossier de commande</strong> : l'ensemble des pièces que vous joignez à votre demande. Trois types de pièces font la différence.</p>
<p><strong>Les sources.</strong> Le texte du décret, le rapport d'activité, le compte rendu de la dernière réunion, le tableau des effectifs. L'IA travaille infiniment mieux sur un document que sur sa mémoire. Sa mémoire est générale, datée et parfois fausse. Votre document est précis et à jour.</p>
<p>Soyez sélectif. Mieux vaut trois extraits ciblés qu'un rapport de deux cents pages dans lequel l'information utile se noie. Si vous joignez un long document, indiquez les chapitres à exploiter.</p>

<div class="cmd"><span class="cmd-label">Consigne anti-invention</span><p>Appuie-toi uniquement sur les documents fournis. Si une information nécessaire manque, signale-la entre crochets [À COMPLÉTER : ...] au lieu de l'inventer.</p></div>

<li><strong>Objet</strong> : une ligne, qui dit ce qu'on attend du Ministre. « Demande d'arbitrage sur... », « Pour information sur... », « Proposition de... ».</li>
<li><strong>Contexte</strong> : trois à cinq lignes. Les faits, rien que les faits.</li>

<div class="sample"><span class="cmd-label">Exemple de note (fictif)</span><p><strong>Objet :</strong> Demande d'arbitrage sur la proposition de partenariat d'un groupe privé pour l'équipement du centre de formation aux métiers du BTP de la ville X.<br><strong>Contexte :</strong> Le centre ouvrira à la rentrée prochaine avec 240 places. L'équipement des ateliers n'est financé qu'à 60 %. Un groupe de BTP propose de compléter l'équipement en échange de la priorité de recrutement sur les diplômés.<br><strong>Enjeux :</strong> ouverture dans les délais ; image d'un partenariat public-privé réussi ; risque de dépendance à un seul employeur.<br><strong>Options :</strong> 1/ Accepter en l'état : ouverture garantie, mais exclusivité de fait. 2/ Accepter en limitant la priorité de recrutement à 30 % des diplômés : équilibre, mais négociation de trois à quatre semaines. 3/ Refuser et différer l'ouverture de deux ateliers : indépendance préservée, mais signal négatif.<br><strong>Recommandation :</strong> Option 2. Elle garantit l'ouverture à la rentrée et préserve la liberté des diplômés.<br><strong>Prochaines étapes :</strong> mandat au directeur de l'établissement pour négocier sous quinze jours ; projet de convention soumis au cabinet avant le 30.</p></div>

<p>Pourquoi ? Parce que les comparaisons internationales mobilisent une densité exceptionnelle de chiffres, de dates et de noms d'institutions. Autant d'occasions de se tromper : un taux d'insertion d'une année attribué à une autre, un programme qui a changé de nom, une réforme abandonnée présentée comme en vigueur, un chiffre régional présenté comme national.</p>
<p>La méthode tient en cinq étapes.</p>
<p><strong>1/ Le chef de file construit la grille.</strong> Quels critères de comparaison sont pertinents pour votre question ? Contexte économique, dispositif, gouvernance, financement, résultats mesurés, durée de mise en œuvre.</p>
<p><strong>2/ Le chef de file propose les pays.</strong> Exigez une justification de chaque choix. Comparer la Côte d'Ivoire à l'Allemagne peut être instructif. La comparer au Sénégal, au Ghana ou au Maroc l'est souvent davantage.</p>

<p>Et quand ils reconnaissent l'empreinte, ils retirent une part de leur crédit à l'auteur. Pas parce qu'il a utilisé un outil, mais parce qu'il ne s'est pas donné la peine de le dépasser.</p>
<p>Voici les marques les plus fréquentes, en français administratif.</p>

<p><strong>Étape 2 : faire analyser.</strong></p>
<div class="cmd"><span class="cmd-label">Commande type</span><p>Analyse mon style d'écriture à partir de ces textes. Décris précisément : mon ton et ma posture, la longueur et le rythme de mes phrases, mon vocabulaire récurrent, mes structures habituelles (ouverture, développement, conclusion), mes procédés (questions, exemples, chiffres), et ce que je n'écris jamais. Cite des extraits à l'appui.</p></div>
<p><strong>Étape 3 : corriger et compléter.</strong> L'analyse sera juste à 70 %. Le reste, c'est à vous de le rectifier. Ajoutez ce que vous savez de vous-même : les mots que vous détestez, les tournures que vous affectionnez, le niveau de formalité selon les destinataires.</p>
<p><strong>Étape 4 : formaliser en une page.</strong> Voici une structure qui fonctionne.</p>
<div class="sample"><span class="cmd-label">Structure d'un profil d'écriture</span><p><strong>Posture :</strong> praticien qui parle à des praticiens. Direct, exigeant, jamais condescendant.<br><strong>Phrases :</strong> courtes en majorité, une phrase longue d'analyse de temps en temps. Pas plus de deux subordonnées.<br><strong>Vocabulaire :</strong> concret, technique quand il le faut. Mots fétiches : « lucidité », « exigence », « prendre nos responsabilités ».<br><strong>Structure :</strong> ouverture sur un fait ou une scène vécue. Axes numérotés 1/, 2/, 3/. Conclusion par des propositions concrètes.<br><strong>Procédés :</strong> questions rhétoriques, interpellation directe du lecteur, chiffres datés.<br><strong>Interdits :</strong> formules creuses, jargon de consultant (« synergie », « holistique »), conclusions qui résument, points d'exclamation en série.</p></div>

<p>Pour le niveau rouge, il existe un cadre juridique précis. En Côte d'Ivoire, la loi n°2013-450 du 19 juin 2013 relative à la protection des données à caractère personnel encadre la collecte, le traitement et le transfert de ces données, y compris vers l'étranger, sous le contrôle de l'ARTCI. Soumettre la liste nominative des agents d'un service à un outil hébergé hors du pays n'est pas une simple maladresse. C'est un traitement de données personnelles, qui engage la responsabilité de l'administration.</p>

<div class="sample"><span class="cmd-label">Structure d'une charte d'usage de l'IA</span><p><strong>1. Objet :</strong> pourquoi cette charte, en trois lignes.<br><strong>2. Outils autorisés :</strong> la stack du service, avec les paramètres obligatoires (exclusion de l'entraînement activée).<br><strong>3. Documents :</strong> la grille vert, orange, rouge, avec des exemples propres au service.<br><strong>4. Interdits absolus :</strong> données personnelles, décisions individuelles, documents classifiés, outils non autorisés.<br><strong>5. Vérifications obligatoires :</strong> tableau de vérification pour tout document sortant, relecture humaine complète.<br><strong>6. Transparence :</strong> comment l'usage est signalé en interne pour les documents importants.<br><strong>7. Référent :</strong> qui consulter en cas de doute.<br><strong>8. Révision :</strong> la charte est revue chaque année.</p></div>

};

let S = { access: false, name: "", plan: "ind", read: {}, valid: {}, notes: {}, quiz: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const code = id => "M" + String(MODULES[id].num).padStart(2, "0");
const unlocked = id => S.access || id === FREE;
const words = html => html.replace(/<[^>]+>/g, " ").split(/\s+/).filter(Boolean).length;
const minutes = html => Math.max(1, Math.round(words(html) / 200));
const modMinutes = id => MODULES[id].lessons.reduce((t, l) => t + minutes(l.b), 0);
const lessonCount = ORDER.reduce((t, id) => t + MODULES[id].lessons.length, 0);
const questionCount = ORDER.reduce((t, id) => t + MODULES[id].quiz.length, 0);
const readingTotal = ORDER.reduce((t, id) => t + modMinutes(id), 0);

function status(id) {
  if (S.valid[id]) return "done";
  const m = MODULES[id];
  if (m.lessons.some((_, i) => S.read[id + "-" + i])) return "doing";
  return "todo";
}
function chip(id) {
  if (!unlocked(id)) return '<span class="chip lock">Réservé aux inscrits</span>';
  const s = status(id);
  if (s === "done") return '<span class="chip done">Validé</span>';
  if (s === "doing") return '<span class="chip doing">En cours</span>';
  return '<span class="chip">À commencer</span>';
}
function validCount() { return ORDER.filter(id => S.valid[id]).length; }

function nextTarget() {
  for (const id of ORDER) {
    if (!unlocked(id)) return { id, locked: true };
    if (S.valid[id]) continue;
    const m = MODULES[id];
    const i = m.lessons.findIndex((_, k) => !S.read[id + "-" + k]);
    return { id, step: i === -1 ? m.lessons.length + 1 : i };
  }
  return null;
}

  const m = MODULES[id];
  const r = step < m.lessons.length ? `${code(id)}-L${step + 1}` : step === m.lessons.length ? `${code(id)}-EX` : `${code(id)}-EV`;
  return `<div class="ref"><div class="row"><span>Réf.</span><span>${r}</span></div><div class="row"><span>Objet</span><span>${esc(objet)}</span></div></div>`;
}

function viewModule() {
  const id = V.mod, m = MODULES[id], st = V.step, L = m.lessons.length;
  if (!unlocked(id)) {
    return `<main class="wrap"><div class="reader">${tocHTML(id)}<div class="doc">
      ${refHTML(id, 0, m.title)}
      <div class="locked"><span class="eyebrow">Module réservé</span><h2>${esc(m.title)}</h2><p style="color:var(--muted)">${esc(m.summary)}</p>
      <p style="color:var(--muted);font-size:var(--t-sm)">${L} leçons · ${modMinutes(id)} min de lecture · 1 exercice · 3 questions</p>
      <button class="btn" data-a="access">S'inscrire pour continuer</button></div></div></div></main>`;
  }
  let body = "";
  if (st < L) {
    const les = m.lessons[st];
    body = `${refHTML(id, st, les.t)}
      <div style="display:grid;gap:8px"><span class="eyebrow">Leçon ${st + 1} sur ${L} · ${minutes(les.b)} min</span><h1>${esc(les.t)}</h1></div>
      <div class="prose">${les.b}</div>
      <div class="pager">
        ${st > 0 ? `<button class="btn ghost" data-a="go" data-id="${id}" data-step="${st - 1}">← Leçon précédente</button>` : "<span></span>"}
        <button class="btn" data-a="readnext" data-id="${id}" data-step="${st}">${st + 1 < L ? "Leçon suivante →" : "Passer à l'exercice →"}</button>
      </div>`;
  } else if (st === L) {
    body = `${refHTML(id, st, "Exercice appliqué")}
      <div style="display:grid;gap:8px"><span class="eyebrow">Exercice</span><h1>À vous de jouer</h1></div>
      <div class="prose">${m.ex}</div>
      <div class="field"><label for="notes-${id}">Vos notes de travail</label>
        <textarea id="notes-${id}" data-notes="${id}" placeholder="Notez ici vos réponses. Aucune information sensible : ces notes restent sur cet appareil.">${esc(S.notes[id] || "")}</textarea>
        <span class="saved" id="saved-${id}">${S.notes[id] ? "Enregistré sur cet appareil" : "Enregistrement automatique sur cet appareil"}</span></div>
      <div class="pager">
        <button class="btn ghost" data-a="go" data-id="${id}" data-step="${L - 1}">← Dernière leçon</button>
        <button class="btn" data-a="go" data-id="${id}" data-step="${L + 1}">Passer à l'évaluation →</button>
      </div>`;
  } else {
    body = quizHTML(id);
  }
  return `<main class="wrap"><div class="reader">${tocHTML(id)}<div class="doc">${body}</div></div></main>`;
}

function quizHTML(id) {
  const m = MODULES[id], L = m.lessons.length, res = S.quiz[id];
  const idx = ORDER.indexOf(id), nextId = ORDER[idx + 1];
  let out = `${refHTML(id, L + 1, "Évaluation du module")}
    <div style="display:grid;gap:8px"><span class="eyebrow">Évaluation · 3 questions</span><h1>Vérifiez vos acquis</h1>
    <p style="color:var(--muted)">Le module est validé à partir de deux bonnes réponses sur trois.</p></div>`;
  if (res && res.done) {
    const ok = res.score >= 2;
    out += `<div class="score"><b>${res.score} / 3</b><span>${ok ? "Module validé." : "Module non validé. Relisez les leçons et retentez."}</span></div>
    <div class="quiz">${m.quiz.map((q, qi) => `
      <fieldset><legend><span class="k">Question ${qi + 1}</span>${esc(q.q)}</legend>
      ${q.o.map((o, oi) => {
        const chosen = res.ans[qi] === oi, right = q.a === oi;
        const cls = right ? " right" : chosen ? " wrong" : "";
        const tag = right ? "Bonne réponse" : chosen ? "Votre choix" : "";
        return `<div class="opt${cls}"><span aria-hidden="true">${chosen ? "●" : "○"}</span><span>${esc(o)}</span><span class="v">${tag}</span></div>`;
      }).join("")}
      <p class="expl"><b>${res.ans[qi] === q.a ? "Juste." : "Inexact."}</b> ${esc(q.e)}</p></fieldset>`).join("")}</div>
    <div class="box strong"><span class="eyebrow">À retenir</span><ul>${m.retenir.map(r => `<li style="font-family:var(--serif);font-size:1.0625rem">${esc(r)}</li>`).join("")}</ul></div>
    <div class="pager">
      <button class="btn ghost" data-a="retry" data-id="${id}">Refaire l'évaluation</button>
      ${ok ? (nextId ? `<button class="btn" data-a="open" data-id="${nextId}">${unlocked(nextId) ? "Module suivant →" : "Continuer le parcours →"}</button>` : `<button class="btn" data-a="attest">Voir l'attestation →</button>`) : `<button class="btn" data-a="go" data-id="${id}" data-step="0">Relire les leçons</button>`}
    </div>`;
  } else {
    out += `<form class="quiz" id="quizform" data-id="${id}" novalidate>
      ${m.quiz.map((q, qi) => `<fieldset><legend><span class="k">Question ${qi + 1}</span>${esc(q.q)}</legend>
        ${q.o.map((o, oi) => `<label class="opt" for="q-${id}-${qi}-${oi}"><input type="radio" id="q-${id}-${qi}-${oi}" name="q${qi}" value="${oi}"><span>${esc(o)}</span><span></span></label>`).join("")}
      </fieldset>`).join("")}
      ${V.msg && V.msg.where === "quiz" ? `<div class="msg err" role="alert">${V.msg.text}</div>` : ""}
      <div class="pager"><button type="button" class="btn ghost" data-a="go" data-id="${id}" data-step="${L}">← Exercice</button><button class="btn" type="submit">Valider mes réponses</button></div>
    </form>`;
  }
  return out;
}

function viewAttest() {
  const n = validCount(), complete = n === ORDER.length;
  const d = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  const name = S.name || "Prénom Nom";
  return `<main class="wrap"><div class="att-wrap">
    <div style="display:grid;gap:8px;text-align:center;max-width:60ch"><span class="eyebrow">Attestation de suivi</span>
      <p style="color:var(--muted)">${complete ? "Félicitations. Votre attestation est disponible." : `Délivrée après validation des onze modules. Vous en êtes à ${n} sur 11. Ci-dessous, un aperçu.`}</p></div>
    <div class="att">
      ${complete ? "" : '<span class="stamp" aria-hidden="true">APERÇU</span>'}
      <div class="head"><span>STRATEGEO · Conseil en stratégie publique</span><span>N° SIA-2026-${String(Math.abs(hash(name)) % 10000).padStart(4, "0")}</span></div>
      <h2>Attestation de suivi</h2>
      <div class="body">
        <p>Le soussigné, Jean-François Curtis, fondateur de STRATEGEO, atteste que</p>
        <p class="name">${esc(name)}</p>
        <p>a suivi l'intégralité du parcours <em>Stack IA, la méthode STRATEGEO : l'intelligence artificielle appliquée à l'administration</em>, composé de onze modules, et en a validé les onze évaluations.</p>
        <p>Compétences travaillées : organisation d'une Stack IA, rédaction de commandes, production de livrables institutionnels, vérification des faits, confidentialité des données, encadrement des usages.</p>
      </div>
      <div class="sign"><span>Fait à Abidjan, le ${d}</span><span>Jean-François Curtis<br><span style="color:var(--muted)">Formateur</span></span></div>
    </div>
    <button class="btn ghost" data-a="dash">← Mon parcours</button>
  </div></main>`;
}
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return h; }

/* ---------- Rendu et actions ---------- */

function render(scrollTop = true) {
  let v = "";
  if (V.view === "home") v = viewHome();
  else if (V.view === "access") v = viewAccess();
  else if (V.view === "dash") v = viewDash();
  else if (V.view === "module") v = viewModule();
  else if (V.view === "attest") v = viewAttest();
  app.innerHTML = header() + v + footer();
  addCopyButtons();
  if (V.scrollTo) { const el = document.getElementById(V.scrollTo); V.scrollTo = null; if (el) { el.scrollIntoView(); return; } }
  if (scrollTop) window.scrollTo(0, 0);
}

function addCopyButtons() {
  app.querySelectorAll(".prose .cmd").forEach(box => {
    const b = document.createElement("button");
    b.className = "copy"; b.type = "button"; b.textContent = "Copier";
    b.addEventListener("click", () => {
      const txt = box.querySelector("p").textContent;
      const done = () => toast("Commande copiée");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done).catch(() => selectText(box.querySelector("p")));
      } else selectText(box.querySelector("p"));
    });
    box.appendChild(b);
  });
}
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné, copiez-le avec votre clavier"); }

let toastT;
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

function go(view, extra = {}) { V = Object.assign({ view, mod: null, step: 0, msg: null, scrollTo: null }, extra); render(!extra.scrollTo); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, step = b.dataset.step != null ? +b.dataset.step : 0;
  if (a === "home") go("home");
  else if (a === "plans") { if (S.access) go("dash"); else go("home", { scrollTo: "formules" }); }
  else if (a === "access") { if (b.dataset.plan) { S.plan = b.dataset.plan; save(); } go("access"); }
  else if (a === "dash") go("dash");
  else if (a === "attest") go("attest");
  else if (a === "open") {
    let s = 0;
    if (unlocked(id)) { const m = MODULES[id]; const i = m.lessons.findIndex((_, k) => !S.read[id + "-" + k]); s = S.valid[id] ? 0 : (i === -1 ? m.lessons.length : i); }
    go("module", { mod: id, step: s });
  }
  else if (a === "go") go("module", { mod: id, step });
  else if (a === "readnext") { S.read[id + "-" + step] = true; save(); go("module", { mod: id, step: step + 1 }); }
  else if (a === "retry") { delete S.quiz[id]; save(); go("module", { mod: id, step: MODULES[id].lessons.length + 1 }); }
  else if (a === "reset") {
    if (b.dataset.confirm === "1") { S = { access: false, name: "", plan: "ind", read: {}, valid: {}, notes: {}, quiz: {} }; save(); go("home"); toast("Démonstration réinitialisée"); }
    else { b.dataset.confirm = "1"; b.textContent = "Confirmer la réinitialisation ?"; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ""; b.textContent = "Réinitialiser la démonstration"; } }, 4000); }
  }
});

document.addEventListener("change", e => {
  if (e.target.name === "plan") {
    S.plan = e.target.value; save();
    const btn = document.getElementById("pay-btn");
    if (btn) btn.textContent = S.plan === "inst" ? "Envoyer la demande de devis" : "Simuler le paiement";
  }
});

document.addEventListener("input", e => {
  const id = e.target.dataset && e.target.dataset.notes;
  if (id) { S.notes[id] = e.target.value; save(); const s = document.getElementById("saved-" + id); if (s) s.textContent = "Enregistré sur cet appareil"; }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "payform") {
    const name = document.getElementById("acc-name").value.trim();
    const mail = document.getElementById("acc-mail").value.trim();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) {
      V.msg = { where: "pay", err: true, text: "Indiquez votre nom et une adresse électronique valide pour continuer." };
      render(false); return;
    }
    S.name = name; save();
    if (S.plan === "inst") {
      V.msg = { where: "pay", err: false, text: "Demande de devis enregistrée (simulation). Dans la version finale, elle partirait vers STRATEGEO. En attendant, activez le code de démonstration pour explorer le parcours." };
      render(false); return;
    }
    S.access = true; save();
    go("dash"); toast("Paiement simulé. Accès ouvert pour 12 mois.");
  }
  if (f.id === "codeform") {
    const c = document.getElementById("acc-code").value.trim().toUpperCase();
    if (c === DEMO_CODE) {
      S.access = true;
      const n = document.getElementById("acc-name"); if (n && n.value.trim()) S.name = n.value.trim();
      save(); go("dash"); toast("Code activé. Accès ouvert.");
    } else {
      V.msg = { where: "code", err: true, text: `Code non reconnu. Vérifiez la saisie. Pour la démonstration, utilisez ${DEMO_CODE}.` };
      render(false);
    }
  }
  if (f.id === "quizform") {
    const id = f.dataset.id, m = MODULES[id];
    const ans = m.quiz.map((_, qi) => { const c = f.querySelector(`input[name="q${qi}"]:checked`); return c ? +c.value : -1; });
    if (ans.includes(-1)) { V.msg = { where: "quiz", text: "Répondez aux trois questions avant de valider." }; render(false); return; }
    const score = ans.reduce((t, a, qi) => t + (a === m.quiz[qi].a ? 1 : 0), 0);
    S.quiz[id] = { done: true, ans, score };
    if (score >= 2) { S.valid[id] = true; m.lessons.forEach((_, i) => S.read[id + "-" + i] = true); }
    save(); V.msg = null; render(true);
    toast(score >= 2 ? "Module validé" : "Module non validé");
  }
});

render();
</script>
</body>
</html>
